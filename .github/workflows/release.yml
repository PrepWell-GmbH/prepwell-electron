name: Build & Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags: v1.0.0, v1.1.0, etc.

permissions:
  contents: write  # Needed for creating GitHub Releases

jobs:
  build-mac:
    name: Build macOS
    # Bewusst NICHT macos-latest: seit das auf macOS 26 zeigt, scheitert das
    # Signieren (Run 42996301240, "SecKeychainUnlock: passphrase not correct").
    # electron-builder 25.1.8 uebergibt an `security set-key-partition-list -k`
    # das .p12-Passwort statt des Passworts seines temporaeren Schluesselbunds;
    # macOS 15 laesst das durch, macOS 26 prueft es. Behoben ab
    # electron-builder 26.16.1 — nach dem Upgrade wieder auf macos-latest.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build & Package
        # Muss über dem 2h-Poll-Fenster von scripts/notarize.js liegen.
        timeout-minutes: 150
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: out/*.dmg

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build & Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-build
          path: out/*.exe

  release:
    name: Create GitHub Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
