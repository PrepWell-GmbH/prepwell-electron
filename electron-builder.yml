appId: de.prepwell.desktop
productName: PrepWell
copyright: Copyright © 2026 PrepWell

directories:
  output: out
  buildResources: resources

files:
  - dist/**/*
  - resources/offline.html
  - package.json

# ─── macOS ───────────────────────────────────────────────
mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch:
        - universal   # Intel + Apple Silicon in einem Binary
  icon: resources/icon.png  # electron-builder converts to .icns automatically
  darkModeSupport: true
  notarize: false          # afterSign hook handles notarization; prevent electron-builder auto-notarize
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist

afterPack: scripts/afterPack.js
afterSign: scripts/notarize.js

dmg:
  sign: false                # DMG should not be signed separately (app inside is already signed+notarized)
  artifactName: PrepWell.${ext}
  title: PrepWell
  iconSize: 80
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ─── Windows ─────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

nsis:
  artifactName: PrepWell-Setup.${ext}
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  installerLanguages:
    - de

# ─── Auto Update ─────────────────────────────────────────
publish:
  provider: github
  # Muss auf die Org zeigen, in der das Repo tatsaechlich liegt: hier laedt
  # electron-builder die Release-Assets hoch, und secrets.GITHUB_TOKEN ist auf
  # genau dieses Repo ausgestellt. Der alte Wert (FerdinandvonWaitzGitHub) hat
  # nur ueber GitHubs Transfer-Redirect funktioniert — eine Kruecke, die
  # wegfaellt, sobald jemand ein Repo unter dem alten Pfad anlegt.
  owner: PrepWell-GmbH             # ← GitHub Org/User
  repo: prepwell-electron          # ← Repo Name
