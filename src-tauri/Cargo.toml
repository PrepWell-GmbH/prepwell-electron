[package]
name = "prepwell-desktop"
version = "0.0.0" # Die App-Version kommt aus ../package.json (tauri.conf.json → "version").
description = "PrepWell Desktop App — Tauri-Shell"
authors = ["PrepWell"]
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSPanel", "NSResponder"] }

[profile.release]
# Kleines Binary: die Shell ist nicht rechenlastig.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
