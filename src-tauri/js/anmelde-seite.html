<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>PrepWell — Anmeldung</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      background: #fafafa;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    main { text-align: center; max-width: 420px; padding: 2rem; }
    .marke { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #E85A5A; margin-bottom: 1.25rem; }
    h1 { font-size: 1.35rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { font-size: 0.95rem; color: #737373; line-height: 1.5; }
    @media (prefers-color-scheme: dark) {
      body { background: #171717; color: #f5f5f5; }
      p { color: #a3a3a3; }
    }
  </style>
</head>
<body>
  <main>
    <div class="marke">PrepWell</div>
    <h1 id="titel">Anmeldung wird abgeschlossen …</h1>
    <p id="text"></p>
    <noscript><p>Bitte aktiviere JavaScript in deinem Browser und starte die Anmeldung in PrepWell neu.</p></noscript>
  </main>
  <script>
    (() => {
      const TEXTE = {
        fertig: ['Du bist angemeldet', 'PrepWell ist jetzt geöffnet. Diesen Tab kannst du schließen.'],
        abbruch: ['Anmeldung nicht abgeschlossen', 'Wechsle zurück zu PrepWell und versuche es noch einmal. Diesen Tab kannst du schließen.'],
        abgelaufen: ['Dieser Anmelde-Link ist nicht mehr gültig', 'Starte die Anmeldung in PrepWell noch einmal.'],
      };
      const zeige = (art) => {
        document.getElementById('titel').textContent = TEXTE[art][0];
        document.getElementById('text').textContent = TEXTE[art][1];
        document.title = 'PrepWell — ' + TEXTE[art][0];
      };
      // Was der Anmelde-Server mitgegeben hat: die Sitzung im Fragment, ein Abbruch als `error=`.
      const daten = location.search + location.hash;
      // Sofort aus Adresszeile und Verlauf nehmen.
      try { history.replaceState(null, '', '/'); } catch (e) { /* dann bleibt die Adresse eben stehen */ }
      if ('__ZUSTAND__' !== 'offen' || !daten) return zeige('abgelaufen');
      fetch('/__GEHEIM__', { method: 'POST', body: daten })
        .then((antwort) => zeige(!antwort.ok ? 'abgelaufen' : /[?#&]error=/.test(daten) ? 'abbruch' : 'fertig'))
        .catch(() => zeige('abgelaufen'));
    })();
  </script>
</body>
</html>
